<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock & Exam Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>⏰ Digital Clock & Exam Countdown</h1>

    <!-- Digital Clock -->
    <div class="clock">
      <h2>Current Time</h2>
      <div id="digitalClock"></div>
    </div>

    <!-- Countdown Timer -->
    <div class="countdown">
      <h2>Exam Countdown</h2>
      <p>Exam Date: <span id="examDate">30 August 2026, 09:00 AM</span></p>
      <div id="timer"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
