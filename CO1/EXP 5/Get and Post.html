<!DOCTYPE html>
<html>
<head>
  <title>GET and POST Method Forms</title>
</head>
<body>
  <h2>GET Method Form</h2>
  <form action="get_result.html" method="get">
    <label for="get_name">Name:</label>
    <input type="text" id="get_name" name="name"><br><br>

    <label for="get_email">Email:</label>
    <input type="email" id="get_email" name="email"><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </form>

  <hr>

  <h2>POST Method Form</h2>
  <form action="post_result.html" method="post">
    <label for="post_name">Name:</label>
    <input type="text" id="post_name" name="name"><br><br>

    <label for="post_email">Email:</label>
    <input type="email" id="post_email" name="email"><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </form>
</body>
</html>
