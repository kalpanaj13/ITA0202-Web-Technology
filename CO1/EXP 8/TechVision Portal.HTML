<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future Innovators Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e3f2fd, #fce4ec);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #0d47a1;
      color: white;
      text-align: center;
      padding: 25px;
    }

    header h1 {
      font-size: 2.5em;
    }

    nav {
      background-color: #1565c0;
      padding: 12px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-weight: bold;
      font-size: 1.1em;
    }

    nav a:hover {
      text-decoration: underline;
    }

    section {
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }

    .gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
    }

    .gallery img {
      border-radius: 10px;
      width: 300px;
      height: 200px;
      object-fit: cover;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    iframe {
      width: 100%;
      height: 400px;
      border: 2px solid #0d47a1;
      border-radius: 10px;
    }

    footer {
      background-color: #0d47a1;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚀 Future Innovators Hub 🌍</h1>
    <p>Empowering minds to create, code, and change the world!</p>
  </header>

  <nav>
    <a href="#gallery">Gallery</a>
    <a href="#iframe">Inspiration Video</a>
    <a href="https://www.ted.com" target="_blank">TED Talks</a>
    <a href="https://www.edx.org" target="_blank">Online Courses</a>
  </nav>

  <section id="gallery">
    <h2>Innovation Highlights</h2>
    <div class="gallery">
      <a href="https://www.nasa.gov" target="_blank">
        <img src="https://cdn.pixabay.com/photo/2019/09/03/09/45/space-4447125_1280.jpg" alt="Space Exploration">
      </a>
      <a href="https://www.tesla.com" target="_blank">
        <img src="https://cdn.pixabay.com/photo/2016/11/29/09/08/abstract-1867838_1280.jpg" alt="Electric Innovation">
      </a>
      <a href="https://www.apple.com" target="_blank">
        <img src="https://cdn.pixabay.com/photo/2015/05/31/12/14/technology-791029_1280.jpg" alt="Modern Technology">
      </a>
      <a href="https://www.un.org/sustainabledevelopment/" target="_blank">
        <img src="https://cdn.pixabay.com/photo/2017/08/06/22/01/code-2599250_1280.jpg" alt="Sustainable Development">
      </a>
      <a href="https://www.openai.com" target="_blank">
        <img src="https://cdn.pixabay.com/photo/2020/06/19/09/35/artificial-intelligence-5314869_1280.jpg" alt="Artificial Intelligence">
      </a>
    </div>
  </section>

  <section id="iframe">
    <h2>Embedded Inspiration Video</h2>
    <iframe src="https://www.youtube.com/embed/2ePf9rue1Ao" title="The Future of Innovation"></iframe>
  </section>

  <footer>
    © 2026 Future Innovators Hub | Designed by Kalpana J
  </footer>
</body>
</html>
