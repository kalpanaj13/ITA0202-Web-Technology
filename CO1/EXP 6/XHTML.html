<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Tamil Nadu</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #fff8e1, #ffe0b2);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      background-color: #ff7043;
      color: white;
      padding: 20px;
      border-radius: 10px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    section {
      margin: 30px auto;
      max-width: 800px;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    ul {
      list-style-type: square;
      color: #ff7043;
      font-weight: bold;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, select, button {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
    }

    button {
      background-color: #ff7043;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #e64a19;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 1em;
    }

    a {
      color: #ff7043;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌴 Explore Tamil Nadu 🌊</h1>
    <p>Discover temples, hill stations, beaches, waterfalls, and delicious cuisine!</p>
  </header>

  <section>
    <h2>Popular Tourist Places</h2>
    <ul>
      <li>Ooty</li>
      <li>Goa</li>
      <li>Madurai</li>
      <li>Rameswaram</li>
      <li>Kanyakumari</li>
    </ul>
  </section>

  <section>
    <h2>Tour Package Registration</h2>
    <form>
      <label>Name:</label>
      <input type="text" placeholder="Enter your name">

      <label>Email:</label>
      <input type="email" placeholder="Enter your email">

      <label>Select Destination:</label>
      <select>
        <option>Ooty</option>
        <option>Goa</option>
        <option>Madurai</option>
        <option>Rameswaram</option>
        <option>Kanyakumari</option>
      </select>

      <button type="submit">Book Now</button>
    </form>
  </section>

  <footer>
    For more information visit <a href="https://www.tamilnadutourism.tn.gov.in" target="_blank">Tamil Nadu Tourism</a>.
  </footer>
</body>
</html>
