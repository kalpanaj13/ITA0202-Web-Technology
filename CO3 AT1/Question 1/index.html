<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #displayBtn {
            background: #667eea;
            color: white;
        }

        #displayBtn:hover {
            background: #5568d9;
            transform: translateY(-2px);
        }

        #removeBtn {
            background: #f1f1f1;
            color: #444;
        }

        #removeBtn:hover {
            background: #ddd;
        }

        .profile-area {
            min-height: 100%;
        }

        .profile-title {
            font-size: 22px;
            color: #333;
            margin-bottom: 20px;
        }

        .profile {
            background: linear-gradient(135deg, #f8f9ff, #eef0ff);
            border: 1px solid #dfe3ff;
            border-radius: 15px;
            padding: 25px;
        }

        .profile-icon {
            width: 70px;
            height: 70px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            margin: 0 auto 15px;
        }

        .profile h2 {
            text-align: center;
            color: #333;
            margin-bottom: 22px;
        }

        .detail {
            background: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .detail span {
            color: #777;
            font-size: 13px;
            display: block;
            margin-bottom: 3px;
        }

        .detail strong {
            color: #333;
            font-size: 15px;
        }

        .empty-message {
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #999;
            border: 2px dashed #ddd;
            border-radius: 15px;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Registration Form -->
        <div class="card">

            <div class="header">
                <h1>Student Registration</h1>
                <p>Enter your details to generate your student profile.</p>
            </div>

            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name"
                       placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="regno">Register Number</label>
                <input type="text" id="regno"
                       placeholder="Enter register number">
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department"
                       placeholder="e.g. Computer Science">
            </div>

            <div class="form-group">
                <label for="year">Year of Study</label>

                <select id="year">
                    <option value="">Select your year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>

            <div class="buttons">
                <button id="displayBtn">Display Profile</button>
                <button id="removeBtn">Remove</button>
            </div>

        </div>


        <!-- Profile Display -->
        <div class="card profile-area">

            <h2 class="profile-title">Student Preview</h2>

            <div id="profileContainer">

                <div class="empty-message">
                    <p>
                        Your student profile will<br>
                        appear here.
                    </p>
                </div>

            </div>

        </div>

    </div>


    <script>

        // Display Profile
        document.getElementById("displayBtn")
        .addEventListener("click", function() {

            // Read form values using getElementById()
            let name =
                document.getElementById("name").value.trim();

            let regno =
                document.getElementById("regno").value.trim();

            let department =
                document.getElementById("department").value.trim();

            let year =
                document.getElementById("year").value;


            // Validate fields
            if (name === "" ||
                regno === "" ||
                department === "" ||
                year === "") {

                alert("Please enter all student details.");
                return;
            }


            // Get profile container
            let container =
                document.getElementById("profileContainer");


            // Clear previous profile
            container.innerHTML = "";


            // Create profile div
            let profile =
                document.createElement("div");

            // Add CSS class using classList
            profile.classList.add("profile");


            // Create profile icon
            let icon =
                document.createElement("div");

            icon.classList.add("profile-icon");

            icon.textContent =
                name.charAt(0).toUpperCase();


            // Create heading
            let heading =
                document.createElement("h2");

            heading.textContent =
                "Student Profile";


            // Create details
            let nameDetail =
                createDetail("Student Name", name);

            let regDetail =
                createDetail("Register Number", regno);

            let deptDetail =
                createDetail("Department", department);

            let yearDetail =
                createDetail("Year of Study", year);


            // Add elements to profile
            profile.appendChild(icon);
            profile.appendChild(heading);

            profile.appendChild(nameDetail);
            profile.appendChild(regDetail);
            profile.appendChild(deptDetail);
            profile.appendChild(yearDetail);


            // Display profile
            container.appendChild(profile);

        });


        // Function to create profile details
        function createDetail(label, value) {

            let detail =
                document.createElement("div");

            detail.classList.add("detail");


            let labelElement =
                document.createElement("span");

            labelElement.textContent = label;


            let valueElement =
                document.createElement("strong");

            valueElement.textContent = value;


            detail.appendChild(labelElement);
            detail.appendChild(valueElement);


            return detail;
        }


        // Remove Profile
        document.getElementById("removeBtn")
        .addEventListener("click", function() {

            let container =
                document.getElementById("profileContainer");

            container.innerHTML =
                '<div class="empty-message">' +
                '<p>Your student profile will<br>' +
                'appear here.</p>' +
                '</div>';

        });

    </script>

</body>

</html>
